services:
  # データベース（PostgreSQL 19）。データは名前付きボリュームで永続化する。
  db:
    # イメージはダイジェスト固定（mutable なタグだけに頼らない）。
    image: postgres:19@sha256:e99b33203b969310f42fd7edf8b3a295ee81a9909a3e2569b3ce87f25b1f4ca0
    container_name: etax-agent-db
    restart: unless-stopped
    # 認証情報はリポジトリ直下の .env（Git管理外）から読む。直書きしない。
    # POSTGRES_PASSWORD は URL に組み込むため、英数字のみにする。
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-etax}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD を .env に設定してください}
      POSTGRES_DB: ${POSTGRES_DB:-etaxagent}
    volumes:
      # postgres:18以降の推奨レイアウト（データは 19/docker 配下に入る）。
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-etax} -d $${POSTGRES_DB:-etaxagent}"]
      interval: 5s
      timeout: 3s
      retries: 12

  # アプリ本体（Hono サーバー + 画面配信）。
  app:
    build: .
    container_name: etax-agent-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # AGENT_API_KEY・ETAX_ENCRYPTION_KEY など秘密はホスト側の .env から読む（Git管理外）。
    # 認証まわりは packages/server/.env で必ず明示すること（未設定だと認証なしで
    # 起動するフェイルオープンになる）:
    #   ETAX_AUTH_MODE=required   … 公開（SaaS）運用では必須。未設定は単一ユーザー無認証
    #   ETAX_ENCRYPTION_KEY       … 納税者情報の暗号化鍵（required 時は未設定で起動エラー）
    #   ETAX_AUTH_SECRET          … セッション署名鍵
    #   ETAX_PUBLIC_URL           … メール内リンクの生成元オリジン
    env_file:
      - packages/server/.env
    environment:
      PORT: "43107"
      # DB は compose 内の db サービスへ。認証情報は db と同じ変数から組み立てる。
      DATABASE_URL: postgres://${POSTGRES_USER:-etax}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-etaxagent}
    # SystemOne（Ollama 等のローカルLLM）はデプロイ構成に含めない（重いため、
    # 使う場合は別PCで運用する前提）。未接続でもアプリは正常に動作し、
    # 科目判定は履歴・ルールへフォールバックする。接続先が要る場合だけ
    # packages/server/.env の SYSTEMONE_BASE_URL で指定する。
    ports:
      # Cloudflare Tunnel の etax サービスがこのポートへ流す。
      - "127.0.0.1:43107:43107"
    volumes:
      # サーバー運用データ（アップロードファイル・freee試算表・科目判定の
      # 学習履歴）はホスト側に残す。DB は db サービス側のボリューム。
      # アプリは非 root（bun ユーザー、uid 1000）で動くため、このディレクトリは
      # uid 1000 が読み書きできる権限にしておくこと。
      - ./packages/server/data:/app/packages/server/data

  # オブジェクトストレージ（Garage、S3互換）。領収書・固定資産画像の実体置き場。
  # ブラウザは署名付きURLで Garage と直接やり取りし、アプリは署名と
  # メタ操作だけを行う（バイト列はアプリを経由しない）。
  # 設定は garage.toml（秘密を含むため Git 管理外。garage.toml.example 参照）。
  # 初期化は scripts/provision-garage.sh（レイアウト・バケット・キー・CORS）。
  garage:
    image: dxflrs/garage:v2.5.0@sha256:23b16d34e0348d9aca9b960a7429a7e6d494974b5288bfb8f6c3ab856895f71e
    container_name: etax-agent-garage
    restart: unless-stopped
    command: ["/garage", "-c", "/etc/garage.toml", "server"]
    volumes:
      - ./garage.toml:/etc/garage.toml:ro
      - garagedata:/var/lib/garage
    ports:
      # Cloudflare Tunnel の mini-files ホスト名がこのポートへ流す
      # （署名付きURLの公開エンドポイント）。
      - "127.0.0.1:43108:3900"

volumes:
  pgdata:
    name: etax-pgdata
  garagedata:
    name: etax-garagedata
